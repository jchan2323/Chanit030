<meta charset="UTF-8">
<title>Justin Chan</title>
<link rel="stylesheet" href="style.css">
</head>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f9f9f9;
  }
  header {
    background-color: #111;
    padding: 15px;
    text-align: center;
  }
  header h1 {
    color: white;
    margin: 0;
  }
  .nav a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
  }
  .nav a:hover {
    text-decoration: underline;
  }
  h2 {
    text-align: center;
    margin-top: 40px;
  }
  select {
    display: block;
    margin: 20px auto;
    padding: 10px;
    font-size: 1em;
  }
  #result-count {
    text-align: center;
    margin-bottom: 20px;
  }
  #items-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px 40px; /* adds space around content */
    box-sizing: border-box;
  }
  .item-card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .item-card h3 {
    margin-top: 0;
  }
  .item-tag {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 10px;
    background-color: #e0e0e0;
    border-radius: 5px;
    font-size: 0.85em;
  }

<body>
<header>
<h1>Justin Chan</h1>
<nav class="nav">
  <a href="index.html"
     onclick="gtag('event', 'nav_click', { link_text: 'Home', link_destination: 'index.html' })">Home</a>

  <a href="about.html"
     onclick="gtag('event', 'nav_click', { link_text: 'About', link_destination: 'about.html' })">About</a>

  <a href="work.html"
     onclick="gtag('event', 'nav_click', { link_text: 'Work', link_destination: 'work.html' })">Work</a>

  <a href="contact.html"
     onclick="gtag('event', 'nav_click', { link_text: 'Contact', link_destination: 'contact.html' })">Contact</a>

  <a href="gallery.html"
     onclick="gtag('event', 'nav_click', { link_text: 'Gallery', link_destination: 'gallery.html' })">Gallery</a>

  <a href="Interests.html"
     onclick="gtag('event', 'nav_click', { link_text: 'Interests', link_destination: 'Interests.html' })">Interests</a>

</header>


<h2>Interests</h2>

<select onchange="filterItems(this.value)">
  <option value="">All</option>
  <option value="Health">Health</option>
  <option value="Business">Business</option>
  <option value="Lifestyle">Lifestyle</option>
</select>

<p id="result-count"></p>

<div id="items-container"></div>
